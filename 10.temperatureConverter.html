<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="temperatureConverter.css">
</head>
<body>
    <div id="container">
        <h1>Temperature Converter</h1>
        <input type="number" value ="0" id="input"><br>
        
        <input type="radio" id="toFahrenheit" name="options">
        <label for="toFahrenheit">Celsius To Fahrenheit</label>
        <br>

        <input type="radio" id="toCelsius" name="options">
        <label for="toCelsius">Fahrenheit To Celsius</label>
        <br>

        <button id="submit" onclick="convert()">Submit</button>
        <br>
        <h1 id="output"></h1>
    </div>
    <script src="temperatureConverter.js"></script>
</body>
</html>
