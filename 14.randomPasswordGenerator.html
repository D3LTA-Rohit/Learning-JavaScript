<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="randomPasswordGenerator.css">
</head>

<body>

    <div id="container">
        <h1>Random Password Generator</h1>
        <h4>Choose the set of characters to be include:</h4>
        <div id="options">
            <input type="checkbox" id="lowercase">
            <label for="lowercase">Lowercase Characters</label><br>

            <input type="checkbox" id="uppercase">
            <label for="uppercase">Uppercase Characters</label><br>

            <input type="checkbox" id="numbers">
            <label for="numbers">Numbers</label><br>

            <input type="checkbox" id="symbols">
            <label for="symbols">Symbols</label><br>
        </div>
        <label for="length">Password Length:</label>
        <input type="number" id="length" min=0>

        <button id="generate" onclick="generatePassword()">Generate</button>
        <h5 id="result"></h5>
    </div>

    <script src="randomPasswordGenerator.js"></script>
</body>

</html>
