<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="51.imageSlider.css">
</head>

<body>
    <div class="slider">
        <div class="slides">
            <img class="slide" src="Images/Image1.jpg" alt="Image1">
            <img class="slide" src="Images/Image2.png" alt="Image2">
            <img class="slide" src="Images/Image3.jpg" alt="Image3">
            <img class="slide" src="Images/Image4.jpg" alt="Image4">
            <img class="slide" src="Images/Image5.jpg" alt="Image5">
            <img class="slide" src="Images/Image6.jpg" alt="Image5">
        </div>
        <button class="previous" onclick="previousSlide()">⬅️</button>
        <button class="next" onclick="nextSlide()">➡️</button>
    </div>
    <script src="51.imageSlider.js"></script>
</body>

</html>
